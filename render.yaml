services:
  - type: web
    name: ece-platform-backend
    env: node
    rootDir: server
    buildCommand: npm run render-build
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JDOODLE_CLIENT_ID
        sync: false
      - key: JDOODLE_CLIENT_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: '*'
